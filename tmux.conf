# balamba — tmux server configuration.
#
# Server-level config only: no sessions, windows, panes or commands that need a
# live state file.  lib/tmux.sh starts the private server with:
#
#   tmux -L balamba -f "$BALAMBA_TMUX_CONF"
#
# and then mirrors config into @balamba_* with balamba_config_to_tmux.

# ---------------------------------------------------------------------------
# Keys and core behaviour
# ---------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g monitor-activity on
set -g visual-activity off
set -g focus-events on
set -g window-size latest
set -g renumber-windows off
set -g base-index 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g status-position bottom

# ---------------------------------------------------------------------------
# Status bar: neutral chrome, one blue accent (no default green bar).
# ---------------------------------------------------------------------------
set -g status-style 'bg=colour236 fg=colour252'
set -g status-left-length 60
set -g status-left ' #[fg=colour75,bold]balamba#[fg=colour252,nobold] · #{@balamba_context} '
set -g status-right-length 80
set -g status-right '#[fg=colour244]#{@balamba_git_branch} '

set -g window-status-format \
  '#{?window_activity_flag,#[fg=colour178]● ,}#I:#W'
set -g window-status-current-format \
  '#[fg=colour75,bold]#{?window_activity_flag,#[fg=colour178]● ,}#I:#W#[fg=colour252,nobold]'

# ---------------------------------------------------------------------------
# User options read by pane/ui.py and the shell libs.
# Real values are written by balamba_config_to_tmux; these are cold-start
# defaults so the panes never read an empty option.
# ---------------------------------------------------------------------------
set -g @balamba_tree_width '30'
set -g @balamba_git_width '34'
set -g @balamba_active_refresh '1'
set -g @balamba_idle_refresh '5'
set -g @balamba_git_refresh '2'
set -g @balamba_editor 'vi'
set -g @balamba_default_ref 'origin/main'
set -g @balamba_default_agent 'opencode'
set -g @balamba_theme 'auto'
set -g @balamba_accent 'blue'
set -g @balamba_root ''
set -g @balamba_context ''
set -g @balamba_git_branch ''

# ---------------------------------------------------------------------------
# Delegating bindings
#
# run-shell runs inside the server environment where $TMUX is set, so plain
# `tmux` reaches this server.  @balamba_root is the install root; if it has not
# been mirrored yet we fall back to $BALAMBA_BIN or PATH.
# ---------------------------------------------------------------------------
bind d detach-client
bind r refresh-client -S

bind N run-shell -b 'b="$(tmux show -gv @balamba_root 2>/dev/null)/bin/balamba"; [ -x "$b" ] || b="${BALAMBA_BIN:-balamba}"; exec "$b" internal new-task'
bind P run-shell -b 'b="$(tmux show -gv @balamba_root 2>/dev/null)/bin/balamba"; [ -x "$b" ] || b="${BALAMBA_BIN:-balamba}"; exec "$b" internal add-project'
bind T run-shell -b 'b="$(tmux show -gv @balamba_root 2>/dev/null)/bin/balamba"; [ -x "$b" ] || b="${BALAMBA_BIN:-balamba}"; exec "$b" internal new-terminal'
